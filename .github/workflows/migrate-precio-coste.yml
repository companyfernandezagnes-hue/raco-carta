name: Migrate DB - add precio_coste

# Run this once to add precio_coste column to carta_bebidas table.
# Requires: SUPABASE_DB_PASSWORD secret in GitHub Actions.
# Get it from: Supabase Dashboard > Project Settings > Database > Database password

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run ALTER TABLE
        run: |
          PGPASSWORD="$DB_PASS" psql \
            "host=aws-0-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.xdnqctumnqxtfolmexcu sslmode=require" \
            -c "ALTER TABLE carta_bebidas ADD COLUMN IF NOT EXISTS precio_coste NUMERIC;" \
            && echo "SUCCESS: Column added"
          
          PGPASSWORD="$DB_PASS" psql \
            "host=aws-0-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.xdnqctumnqxtfolmexcu sslmode=require" \
            -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='carta_bebidas' AND column_name='precio_coste';"
        env:
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
