name: Migrate DB - add precio_coste

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Add precio_coste column using supabase-js
        run: |
          node << 'NODESCRIPT'
          const { createClient } = require('@supabase/supabase-js');
          
          async function main() {
            const serviceKey = process.env.SERVICE_KEY;
            console.log('Key prefix:', serviceKey.substring(0, 20) + '...');
            
            const supabase = createClient(
              'https://xdnqctumnqxtfolmexcu.supabase.co',
              serviceKey,
              { auth: { persistSession: false } }
            );
            
            // Try to call a Postgres function that executes DDL
            // Supabase service role can bypass RLS and execute SQL
            // Use the from() API to check if column exists
            const { data: check, error: checkErr } = await supabase
              .from('carta_bebidas')
              .select('precio_coste')
              .limit(1);
            
            if (checkErr && checkErr.message && checkErr.message.includes('does not exist')) {
              console.log('Column does not exist, need to create it');
              
              // Use rpc to run SQL - need a function that wraps DDL
              // Since we cannot run arbitrary SQL via REST without a wrapper function,
              // we need another approach
              console.log('Service key works:', !checkErr.code || checkErr.code === '42703');
              
              // Try using the supabase admin API
              const res = await fetch('https://xdnqctumnqxtfolmexcu.supabase.co/rest/v1/', {
                headers: {
                  'apikey': serviceKey,
                  'Authorization': 'Bearer ' + serviceKey
                }
              });
              console.log('REST API status:', res.status);
              const schema = await res.json();
              console.log('Schema paths:', Object.keys(schema).slice(0, 10).join(', '));
              
            } else if (!checkErr) {
              console.log('SUCCESS: precio_coste column already exists!');
              console.log('Data sample:', JSON.stringify(check));
            } else {
              console.log('Other error:', checkErr.code, checkErr.message);
            }
          }
          
          // Install and run
          require('child_process').execSync('npm install @supabase/supabase-js --silent', { stdio: 'inherit' });
          main().catch(console.error);
          NODESCRIPT
        env:
          SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}
