name: Migrate DB - add precio_coste

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI and run migration
        run: |
          # Install Supabase CLI
          npm install -g supabase@latest 2>/dev/null || npx supabase --version

          # Check what the service key looks like
          echo "Service key prefix: $(echo $SERVICE_KEY | cut -c1-20)..."
          
          # Try to use it as anon key with supabase client
          # Use node to call the Supabase REST API properly
          node << 'EOF'
          const https = require('https');
          
          const key = process.env.SERVICE_KEY;
          console.log('Key type:', key.startsWith('eyJ') ? 'JWT' : key.startsWith('sb_') ? 'sb_format' : 'unknown');
          console.log('Key length:', key.length);
          
          // Try the PostgREST endpoint with the key
          function doRequest(path, method, body, callback) {
            const options = {
              hostname: 'xdnqctumnqxtfolmexcu.supabase.co',
              port: 443,
              path: path,
              method: method || 'GET',
              headers: {
                'apikey': key,
                'Authorization': 'Bearer ' + key,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
              }
            };
            if (body) options.headers['Content-Length'] = Buffer.byteLength(body);
            
            const req = https.request(options, res => {
              let data = '';
              res.on('data', c => data += c);
              res.on('end', () => callback(res.statusCode, data));
            });
            req.on('error', e => callback(0, e.message));
            if (body) req.write(body);
            req.end();
          }
          
          // Check if column exists
          doRequest('/rest/v1/carta_bebidas?select=precio_coste&limit=1', 'GET', null, (status, data) => {
            console.log('Check column status:', status);
            console.log('Check data:', data.substring(0, 200));
          });
          EOF
        env:
          SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}
