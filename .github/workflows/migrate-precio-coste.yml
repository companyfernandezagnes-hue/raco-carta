name: Migrate DB - add precio_coste

# Usa el service key de Supabase directamente como contraseña PostgreSQL
# No requiere secrets adicionales - usa VITE_SUPABASE_SERVICE_KEY que ya existe

on:
  workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run ALTER TABLE via service key
        run: |
          # Supabase acepta el service key como contraseña en el connection pooler (session mode port 5432)
          PGPASSWORD="${SERVICE_KEY}" psql \
                        "host=aws-0-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.torgtlggdnvvdarsogqu sslmode=require" \
            -c "ALTER TABLE carta_bebidas ADD COLUMN IF NOT EXISTS precio_coste NUMERIC;" \
            && echo "SUCCESS: Column added or already exists"
          
          # Verify
          PGPASSWORD="${SERVICE_KEY}" psql \
                        "host=aws-0-eu-central-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.torgtlggdnvvdarsogqu sslmode=require" \
            -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='carta_bebidas';"
        env:
          SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}
